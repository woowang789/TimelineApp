spring:
  application:
    name: timeline

  # 애플리케이션은 컨테이너에 넣지 않고 호스트에서 실행한다 → DB/Redis는 127.0.0.1로 붙는다.
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/timeline
    username: timeline
    password: timeline

  jpa:
    hibernate:
      # 스키마의 유일한 관리자는 Flyway다. Hibernate는 검증만 한다.
      ddl-auto: validate
    # OSIV를 끈다 — 커넥션을 뷰 렌더링까지 붙들지 않는다(부하 측정의 전제).
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379

# JWT (0.7 · 마스터 부록 B — Access 30분 / Refresh 14일).
jwt:
  # 로컬 전용 시크릿이다. 저장소에 평문으로 두는 이유는 이 앱이 로컬에서만 뜨고,
  # 운영 배포 대상이 아니기 때문이다(배포한다면 환경변수 JWT_SECRET으로 주입한다).
  # HS256은 키가 최소 256비트여야 하므로 Base64 디코딩 시 32바이트 이상이어야 한다 — 여기서는 48바이트.
  secret: 4MaspBRERr/o0Jx0Viv1BAbp58smx9NdhvdaIrR3765yJeHPo5aUwlE86II4Tz5V
  access-token-ttl: 30m
  refresh-token-ttl: 14d

# bench 프로파일의 Prometheus가 호스트에서 실행 중인 앱의 /actuator/prometheus를 스크레이프한다(로드맵 0.12).
# 노출은 필요한 것만 연다 — env·beans·heapdump까지 열면 측정과 무관한 공격면만 늘어난다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

# nodb 프로파일(0.2)은 0.6에서 제거했다.
# DataSource/JPA 자동구성을 빼는 방식이었는데, 가입 API가 UserRepository에 의존하는 빈을 들여오면서
# "DB 없이 부팅"이 성립하지 않게 됐다(자동구성을 빼면 그 빈들이 만들어지지 못해 기동이 실패한다).
# 부팅 확인은 Testcontainers 통합 테스트가 실제 MySQL/Redis 위에서 대신한다.
